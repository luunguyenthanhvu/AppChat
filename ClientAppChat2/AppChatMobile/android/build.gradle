buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
        jcenter()  // This is sometimes required if dependencies aren't found in Maven Central
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.7.2') // Make sure to specify the gradle plugin version
        classpath("com.facebook.react:react-native-gradle-plugin:0.71.0") // Specify the correct version here
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")

    }
}

apply plugin: "com.facebook.react.rootproject"
